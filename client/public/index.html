<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#010408" />

    <title>CollabBoard — Real-Time Collaborative Whiteboard</title>
    <meta
      name="description"
      content="Draw together in real time. A multi-user collaborative whiteboard built with React, Node.js, Socket.io and MongoDB."
    />

    <!-- link previews when the URL is shared (LinkedIn, WhatsApp, Slack) -->
    <meta property="og:title" content="CollabBoard — Real-Time Collaborative Whiteboard" />
    <meta property="og:description" content="Draw together in real time. Live cursors, shared shapes, instant sync." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://collab-board-xi.vercel.app" />

    <!-- hexagon favicon, drawn inline so no image file is needed -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23010408'/%3E%3Cpolygon points='16,5 26,10.5 26,21.5 16,27 6,21.5 6,10.5' fill='none' stroke='%2300c8ff' stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run CollabBoard.</noscript>
    <div id="root"></div>
  </body>
</html>
